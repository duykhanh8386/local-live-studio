name: Build Windows EXE
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            portable/requirements-lock.txt
            requirements-build.txt
      - name: Install pinned libraries
        run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Fetch and verify FFmpeg
        run: python packaging/fetch_ffmpeg.py
      - name: Enable FFmpeg for tests
        shell: pwsh
        run: 'Join-Path $env:GITHUB_WORKSPACE "_build/ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Run automated tests
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py" -v
      - name: Test desktop and mobile UI
        run: python -X utf8 -m tests.browser_archive_qa
      - name: Build standalone EXE
        run: python -X utf8 packaging/build_exe.py
      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          & dist/windows/LocalLiveStudio.exe --self-check
          if ($LASTEXITCODE -ne 0) { throw 'Bundled tool self-check failed' }
          python -X utf8 packaging/smoke_exe.py dist/windows/LocalLiveStudio.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ github.sha }}
          path: |
            dist/windows/LocalLiveStudio-Windows-x64.zip
            dist/windows/LocalLiveStudio-Windows-x64.zip.sha256
            dist/windows/LocalLiveStudio-Windows-x64.exe.sha256
            dist/windows/update.json
            dist/windows/RELEASE_NOTES.md
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe-${{ github.sha }}
          path: dist/windows
      - name: Publish commit build
        run: python packaging/publish_release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
